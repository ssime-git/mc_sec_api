services:
  security_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.security
    container_name: security_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src/security_api:/app
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - PREDICTION_API_URL=http://prediction_api:8001
      - PREDICTION_API_KEY=${PREDICTION_API_KEY}
      - GDPR_LOG_FILE=/app/data/gdpr_audit.log
    restart: unless-stopped   # Automatically restart container
    networks:
      - app-network
    depends_on:
      - prediction_api

  prediction_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.prediction
    container_name: prediction_api
    ports:
      - "8001:8001"
    environment:
      - API_KEY=${PREDICTION_API_KEY}
    restart: unless-stopped   # Automatically restart container
    networks:
      - app-network

  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: streamlit_app
    ports:
      - "8502:8501"
    volumes:
      - ./src/streamlit_app:/app
    environment:
      - SECURITY_API_URL=http://security_api:8000
      - PREDICTION_API_URL=http://prediction_api:8001
    restart: unless-stopped   # Automatically restart container
    depends_on:
      - security_api
      - prediction_api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
