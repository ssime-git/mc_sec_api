version: '3.8'

services:
  security_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.security
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-secure-secret-key
      - PREDICTION_API_URL=http://prediction_api:8001
      - PREDICTION_API_KEY=internal-secure-key
      - GDPR_LOG_FILE=/app/logs/gdpr_audit.log
    volumes:
      - ./data:/app/users:rw  # Persist user database with read-write access
      - ./logs:/app/logs:rw   # Persist logs
    restart: unless-stopped   # Automatically restart container
    depends_on:
      - prediction_api

  prediction_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.prediction
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models:ro  # Mount models directory as read-only
    environment:
      - API_KEY=internal-secure-key
    restart: unless-stopped   # Automatically restart container
