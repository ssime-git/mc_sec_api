<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - OAuth2 Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
        }
        .data-container {
            background-color: #f9f9f9;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Protected Resource Dashboard</h2>
        <p>Here is your protected data retrieved using OAuth2:</p>
        <div class="data-container">
            <pre>{{ user_data }}</pre>
        </div>
    </div>
</body>
</html>
